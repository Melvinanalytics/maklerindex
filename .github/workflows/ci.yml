name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit test attested SAW
        run: pnpm test
      - name: Generate site from OKF
        run: pnpm generate
      - name: Prove ranking and owner routes
        run: pnpm prove
      - name: Require deploy files
        run: |
          test -f dist/index.html
          test -f dist/hannover/index.html
          test -f dist/hannover/katharina-brandt/index.html
          test -f dist/llms.txt
          test -f dist/robots.txt
          test -f dist/.nojekyll
          grep -q 'Demo' dist/hannover/index.html
          grep -q 'Kein Formular' dist/hannover/katharina-brandt/index.html
          ! grep -qi '<form' dist/index.html dist/hannover/index.html dist/hannover/katharina-brandt/index.html
      - name: Generate Pages-shaped tree and prove it
        env:
          BASE_PATH: /maklerindex
          SITE_ORIGIN: https://melvinanalytics.github.io
        run: pnpm prove
